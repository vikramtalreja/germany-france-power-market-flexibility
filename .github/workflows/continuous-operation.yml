name: Continuous battery operation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/continuous-operation.yml'
      - 'config/continuous-operation.json'
      - 'src/market_flex/continuous.py'
      - 'scripts/analyse_continuous.py'
      - 'scripts/report_continuous.py'
      - 'tests/test_continuous.py'
permissions:
  contents: write
concurrency:
  group: continuous-operation
  cancel-in-progress: false
jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install numpy==2.3.5 pandas==2.2.3 scikit-learn==1.8.0 pyomo==6.10.1 highspy==1.15.1 matplotlib
      - name: Test model and commitment accounting
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Run frozen continuous-operation comparison
        run: python scripts/analyse_continuous.py
      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: continuous-operation-results
          retention-days: 90
          path: |
            data/continuous/
            reports/continuous*
            reports/figures/continuous_2025.svg
      - name: Record status
        if: always()
        env:
          ANALYSIS_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import os,json
          from pathlib import Path
          Path("reports/continuous-status.json").write_text(json.dumps({"status":os.environ["ANALYSIS_STATUS"],"run_url":os.environ["RUN_URL"]},indent=2))
          PY
      - name: Save validated outputs
        if: always()
        env:
          ANALYSIS_STATUS: ${{ job.status }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/continuous-status.json
          if [ "$ANALYSIS_STATUS" = "success" ]; then
            git add -f data/continuous/
            git add reports/continuous* reports/figures/continuous_2025.svg
          fi
          git diff --cached --quiet && exit 0
          git commit -m "Save continuous-operation run status and validated outputs"
          git push origin HEAD:main
